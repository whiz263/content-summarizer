<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Content Summarizer</title>
    <!-- Link to external CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>AI Content Summarizer</h1>
    <p class="subtitle">Paste long articles, essays, or blocks of text to get an instant bulleted breakdown powered by Gemini.</p>
    
    <textarea id="textInput" placeholder="Paste your text here... (minimum 20 words recommended)"></textarea>
    <button id="summarizeBtn" class="btn">Generate Summary</button>

    <div id="resultBox" class="result-box">
        <h2>Key Takeaways</h2>
        <div id="summaryDisplay"></div>
    </div>
</div>

<!-- Link to external JS -->
<script src="script.js"></script>
</body>
</html>
